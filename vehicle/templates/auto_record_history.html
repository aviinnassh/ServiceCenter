{% extends 'base.html' %}
{% block title %}Service History Recorded{% endblock %}

{% block content %}

<style>
  body {
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #e7f0ff, #ffffff);
    color: #1a3d6d;
    text-align: center;
    padding: 50px;
  }

  .message-card {
    display: inline-block;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    padding: 40px 50px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    font-size: 18px;
    font-weight: 600;
    color: #083a72;
    animation: fadeIn 0.7s ease;
  }

  .message-card.success {
    border-left: 6px solid #1fa761;
  }

  .message-card.warning {
    border-left: 6px solid #f0a500;
  }

  .btn-back {
    display: inline-block;
    margin-top: 25px;
    padding: 10px 20px;
    border-radius: 12px;
    background: #0d47a1;
    color: white;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  .btn-back:hover {
    background: #09357a;
    transform: translateY(-2px);
  }

  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
</style>

<div class="message-card success">
  ✅ Service history successfully recorded.
  <br>
  <a href="{% url 'manage_bookings' %}" class="btn-back">Back to Bookings</a>
</div>

{% endblock %}
