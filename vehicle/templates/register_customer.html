<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Customer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    body {
      background: linear-gradient(135deg, #c9e4ff, #ffffff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      animation: fadeIn 0.6s ease-in-out;
    }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .register-wrapper {
      width: 100%;
      max-width: 1100px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      animation: slideUp 0.7s ease;
    }

    @keyframes slideUp { from { transform: translateY(40px); opacity:0;} to { transform: translateY(0); opacity:1;} }

    .left-section {
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: #fff;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .left-section h1 {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .left-section p {
      margin-top: 15px;
      font-size: 1rem;
      opacity: 0.9;
    }

    .left-section .illustration {
      font-size: 90px;
      margin-top: 30px;
      opacity: 0.85;
    }

    .right-section {
      padding: 40px 45px;
    }

    h3 {
      font-weight: 700;
      color: #0d47a1;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-control, textarea {
      border-radius: 12px !important;
      padding: 12px 14px;
      transition: 0.25s ease;
    }

    .form-control:focus {
      box-shadow: 0 0 12px rgba(30, 136, 229, 0.45);
      transform: scale(1.02);
    }

    .input-label {
      font-weight: 600;
      margin-bottom: 6px;
      color: #0d47a1;
    }

    .btn-submit {
      background: #0d47a1;
      color: #fff;
      padding: 12px;
      border-radius: 14px;
      width: 100%;
      font-size: 17px;
      margin-top: 10px;
      transition: 0.3s ease;
      font-weight: 600;
    }

    .btn-submit:hover {
      background: #08306b;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(13, 71, 161, 0.3);
    }

    .error-box {
      background: #ffebee;
      border-left: 4px solid #c62828;
      padding: 10px 15px;
      color: #b71c1c;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .register-wrapper {
        grid-template-columns: 1fr;
      }
      .left-section { text-align: center; }
      .illustration { margin: 20px auto 0; }
    }

    /* Smooth floating animation */
    @keyframes floatAnim {
      0% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }

    .illustration {
      animation: floatAnim 3s ease-in-out infinite;
    }

    /* Fade-in for form fields */
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .right-section input,
    .right-section textarea,
    .right-section button {
      animation: fadeSlide 0.7s ease both;
    }

    .right-section input:nth-of-type(1) { animation-delay: 0.1s; }
    .right-section input:nth-of-type(2) { animation-delay: 0.2s; }
    .right-section input:nth-of-type(3) { animation-delay: 0.3s; }
    .right-section input:nth-of-type(4) { animation-delay: 0.4s; }
    .right-section textarea { animation-delay: 0.5s; }
    .right-section .btn-submit { animation-delay: 0.6s; }

</style>
</head>

<body>

  <div class="register-wrapper">

    <!-- LEFT SECTION WITH VISUALS -->
    <div class="left-section">
      <h1>Create Your Customer<br>Account</h1>
      <p>Manage your vehicles, track service history and book appointments with ease.</p>
      <div class="illustration">🚗.........</div>
    </div>

    <!-- RIGHT SECTION FORM -->
    <div class="right-section">

      <h3>Customer Registration</h3>

      <form method="POST" id="regForm">
        {% csrf_token %}

        {% if form.errors %}
        <div class="error-box">
          {{ form.errors }}
        </div>
        {% endif %}

        <label class="input-label">Username</label>
        <input type="text" name="username" class="form-control mb-3" required>

        <label class="input-label">Email</label>
        <input type="email" name="email" class="form-control mb-3" required>

        <label class="input-label">Password</label>
        <input type="password" name="password" class="form-control mb-3" required>

        <label class="input-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control mb-3" required>

        <hr class="my-4">

        <label class="input-label">Full Name</label>
        <input type="text" name="name" class="form-control mb-3" required>

        <label class="input-label">Address</label>
        <textarea name="address" rows="2" class="form-control mb-3"></textarea>

        <label class="input-label">Phone</label>
        <input type="text" name="phone" class="form-control mb-3" required>

        <label class="input-label">Customer Email</label>
        <input type="email" name="customer_email" class="form-control mb-3" required>

        <button class="btn-submit" id="registerBtn">Register</button>
      </form>

    </div>
  </div>

<script>
  document.getElementById('regForm').addEventListener('submit', function() {
    const btn = document.getElementById('registerBtn');
    btn.innerHTML = "Processing...";
    btn.style.opacity = "0.7";
  });
</script>

</body>
</html>
