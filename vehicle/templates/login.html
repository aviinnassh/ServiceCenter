<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <style>

    body {
      background: linear-gradient(135deg, #c9e4ff, #ffffff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn { 
      from { opacity: 0; } 
      to { opacity: 1; } 
    }

    /* Glass Card */
    .login-box {
      width: 420px;
      padding: 40px 35px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      animation: slideUp 0.7s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      font-weight: 800;
      color: #0d47a1;
      margin-bottom: 25px;
    }

    /* Inputs */
    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
      animation: fadeSlide 0.8s ease both;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #0d47a1;
      opacity: 0.75;
      font-size: 19px;
    }

    .form-control {
      border-radius: 14px;
      padding: 12px 15px 12px 45px;
      transition: 0.25s ease;
    }

    .form-control:focus {
      transform: scale(1.02);
      box-shadow: 0 0 12px rgba(25, 118, 210, 0.45);
    }

    /* Button */
    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 17px;
      border-radius: 14px;
      border: none;
      color: white;
      font-weight: 600;
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      transition: 0.3s ease;
      animation: fadeSlide 0.9s ease both;
    }

    .btn-login:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 20px rgba(13, 71, 161, 0.3);
    }

    /* Extra link */
    .extra-links {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #0d47a1;
    }

    .extra-links a {
      color: #0d47a1;
      font-weight: 600;
      text-decoration: none;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <div class="login-box">

    <h2>Welcome Back</h2>

    <form method="POST">
      {% csrf_token %}

      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" name="username" class="form-control" placeholder="Username" required>
      </div>

      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>

      <button type="submit" class="btn-login">Login</button>

      <div class="extra-links">
        <p>Don’t have an account? <a href="{% url 'home' %}">Register</a></p>
      </div>

    </form>

  </div>

</body>
</html>
