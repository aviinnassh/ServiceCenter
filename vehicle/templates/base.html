<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}Service Center System{% endblock %}</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(145deg, #eaf3ff, #ffffff);
      animation: fadeIn 0.6s ease-in-out;
      min-height: 100vh;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .btn-premium {
    text-decoration: none !important;
}


    /* PREMIUM NAVBAR */
    .navbar-premium {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
      animation: dropDown 0.6s ease-out;
    }

    @keyframes dropDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* PREMIUM BRAND */
    .brand-title {
      font-family: "Orbitron", sans-serif;
      letter-spacing: 1px;
      font-size: 22px;
      color: #0d47a1 !important;
      font-weight: 700;
      transition: 0.3s ease;
    }

    .brand-title:hover {
      text-shadow: 0 0 10px rgba(13, 71, 161, 0.6);
      transform: scale(1.04);
    }

    /* NAV USER TEXT */
    .user-text {
      font-weight: 600;
      color: #0d47a1;
      margin-right: 15px;
    }

    /* PREMIUM BUTTONS */
   .btn-premium {
    border-radius: 10px;
    padding: 8px 18px;
    font-weight: 600;
    border: 2px solid #0d47a1;
    color: #0d47a1;
    background: transparent;
    transition: 0.3s ease;
    text-decoration: none !important; /* ← REMOVE UNDERLINE */
}


    .btn-premium:hover {
      background: #0d47a1;
      color: white !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(13, 71, 161, 0.4);
    }

    /* MAIN CONTENT CARD EFFECT */
    .content-box {
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-premium shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">

      <!-- LEFT: Brand -->
      <a class="navbar-brand brand-title" >
        ⚙ Service & Maintenance
      </a>

      <!-- RIGHT: User Info -->
      <div class="d-flex align-items-center">
        {% if user.is_authenticated %}
          <span class="user-text">Hi, {{ user.username }}</span>
          <a href="{% url 'logout' %}" class="btn-premium">Logout</a>
        {% else %}
          <a href="{% url 'login' %}" class="btn-premium">Login</a>
        {% endif %}
      </div>

    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container mt-4 content-box">
    {% include "messages.html" %}
    {% block content %}{% endblock %}
  </div>

</body>
</html>
