{% extends 'base.html' %}
{% block title %}Add Vehicle{% endblock %}

{% block content %}

<style>

  body {
    background: linear-gradient(135deg, #e3eeff, #ffffff);
    font-family: "Poppins", sans-serif;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }

  .top-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #083b7a;
    font-family: "Orbitron", sans-serif;
  }

  .back-btn {
    padding: 10px 18px;
    background: #0d47a1;
    color: white !important;
    border-radius: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: 0.3s ease;
  }

  .back-btn:hover {
    background: #09357a;
    transform: translateY(-2px);
  }

  /* Wrapper */
  .page-container {
    max-width: 900px;
    margin: 50px auto;
    padding: 15px;
  }

  /* Card Layout */
  .add-card {
    display: flex;
    gap: 35px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(14px);
    border-radius: 22px;
    padding: 40px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    animation: cardPop 0.7s ease;
  }

  /* Left Panel */
  .side-panel {
    width: 35%;
    background: linear-gradient(145deg, #0d47a1, #1976d2);
    padding: 35px 25px;
    border-radius: 18px;
    color: white;
    text-align: center;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.2);
  }

  .side-panel h3 {
    font-size: 23px;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .side-panel p {
    font-size: 14px;
    opacity: 0.9;
  }

  .icon-box {
    font-size: 60px;
    margin-bottom: 10px;
  }

  /* Right Form Area */
  .form-section {
    width: 65%;
  }

  .form-title {
    font-size: 26px;
    font-weight: 700;
    color: #0d47a1;
    text-align: center;
    margin-bottom: 25px;
  }

  /* Floating Label Field */
  .input-box {
    position: relative;
    margin-bottom: 25px;
  }

  .input-box input,
  .input-box select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #bcd4ff;
    background: #f6f9ff;
    transition: 0.3s;
    font-size: 15px;
  }

  .input-box input:focus,
  .input-box select:focus {
    border-color: #0d47a1;
    background: #ffffff;
    box-shadow: 0 0 10px rgba(13,71,161,0.25);
  }

  .input-box label {
    position: absolute;
    top: 50%;
    left: 16px;
    transform: translateY(-50%);
    font-size: 14px;
    color: #395d9d;
    pointer-events: none;
    transition: 0.2s ease;
  }

  /* Floating effect when typing */
  .input-box input:focus + label,
  .input-box input:not(:placeholder-shown) + label,
  .input-box select:focus + label {
    top: -8px;
    left: 10px;
    font-size: 12px;
    background: white;
    padding: 0 4px;
    color: #0d47a1;
  }

  /* Submit Button */
  .btn-save {
    background: linear-gradient(135deg, #0d47a1, #0a357d);
    color: white;
    border: none;
    padding: 15px;
    font-size: 17px;
    border-radius: 14px;
    width: 100%;
    font-weight: 600;
    box-shadow: 0 8px 20px rgba(13,71,161,0.3);
    transition: 0.3s ease;
  }

  .btn-save:hover {
    background: #092f63;
    transform: translateY(-2px);
  }

  /* Back Button */
  .top-back {
    text-align: right;
    margin-bottom: 20px;
  }

  .back-btn {
    padding: 10px 16px;
    background: #0d47a1;
    color: white !important;
    font-weight: 600;
    border-radius: 10px;
    text-decoration: none;
    transition: 0.3s;
  }

  .back-btn:hover {
    background: #09357a;
  }

  @keyframes cardPop {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

</style>

<div class="page-container">

 <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-title">Edit Vehicle Information</div>

    <a href="{% url 'view_vehicle' %}" class="back-btn">
      ← Back
    </a>
  </div>

  <div class="add-card">

    <!-- Left Info Panel -->
    <div class="side-panel">
      <div class="icon-box">🚗</div>
      <h3>Edit Vehicle</h3>
      <p>Register your vehicle to manage bookings, track service, and more.</p>
    </div>

    <!-- Form Panel -->
    <div class="form-section">

      <form method="POST">
        {% csrf_token %}

        {% for field in form %}
          <div class="input-box">
            {{ field }}
            <label>{{ field.label }}</label>
          </div>
        {% endfor %}

        <button type="submit" class="btn-save">Save</button>
      </form>
    </div>

  </div>
</div>

{% endblock %}
